# Local PostgreSQL for development: docker compose up -d
# Matches DATABASE_URL in .env.example.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: learnsolo
      POSTGRES_PASSWORD: learnsolo
      POSTGRES_DB: learnsolo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
