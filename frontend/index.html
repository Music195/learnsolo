<!DOCTYPE html>
<!--
  The one HTML page of the React app. Every address (/, /notes/..., ...)
  gets this same page; React then draws the right content into
  <div id="root"> (see src/main.jsx).

  Things every page needs are loaded here once: Bootstrap, the icons,
  MathJax for formulas, and the demo helpers the interactive figures use.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Solo</title>
    <link rel="icon" type="image/png" href="/static/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=2" />

    <!-- Pre-render theme check to avoid screen flash -->
    <script>
      (function () {
        const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>

    <!-- Bootstrap CSS framework and Font Awesome icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <!-- MathJax: turns $...$ (or \(...\)) into formulas. The settings must come before the script. -->
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Demo helpers (window.NoteGeom, window.NotePlot), served by Flask.
         Notes also ask for these; NoteContent.jsx skips scripts already here.
         (venn.js is only used by a few notes, so it loads when one needs it.) -->
    <script src="/static/js/demos/geom.js"></script>
    <script src="/static/js/demos/plot.js"></script>
    <!-- physkit.js: shared look and tools for the G12 Physics demos (window.PhysKit) -->
    <script src="/static/js/demos/physkit.js"></script>

    <!-- JSXGraph: interactive geometry and physics boards -->
    <link href="/static/css/jsxgraph.css" rel="stylesheet" />
    <script src="/static/js/demos/jsxgraphcore.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Starts the React app -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
