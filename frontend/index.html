<!DOCTYPE html>
<!--
  The one HTML page of the React app. Every address (/, /notes/..., ...)
  gets this same page; React then draws the right content into
  <div id="root"> (see src/main.jsx).

  Things every page needs are loaded here once: Bootstrap, the icons,
  MathJax for formulas, and the demo helpers the interactive figures use.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Solo</title>
    <link rel="icon" href="/static/favicon.png" />

    <!-- Bootstrap CSS framework and Font Awesome icons (same as the old site) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <!-- MathJax: turns $...$ into formulas. The settings must come before the script. -->
    <script>
      MathJax = { tex: { inlineMath: [['$', '$']] } };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Demo helpers (window.NoteGeom, window.NotePlot), served by Flask -->
    <script src="/static/js/demos/geom.js"></script>
    <script src="/static/js/demos/plot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Starts the React app -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
